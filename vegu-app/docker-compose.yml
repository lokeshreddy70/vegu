version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vegu-postgres
    environment:
      POSTGRES_USER: vegu
      POSTGRES_PASSWORD: vegu_secret
      POSTGRES_DB: vegu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vegu']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: vegu-backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://vegu:vegu_secret@postgres:5432/vegu?schema=public
      NODE_ENV: production
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: vegu-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
